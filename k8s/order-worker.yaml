apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      containers:
        - name: order-worker
          image: codsubayi/order-worker:2764a30
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: orderflow
            - name: POSTGRES_USER
              value: orderflow
            - name: POSTGRES_PASSWORD
              value: orderflowpass

            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              value: orderflow
            - name: RABBITMQ_PASSWORD
              value: orderflowpass

            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: order-worker
  namespace: orderflow
spec:
  selector:
    app: order-worker
  ports:
    - port: 8081
      targetPort: 8081